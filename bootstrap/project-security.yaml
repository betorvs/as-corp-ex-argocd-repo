apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  sourceRepos:
    - 'https://github.com/betorvs/as-corp-ex-argocd-repo'
    - 'oci://ghcr.io/betorvs/charts/dvorah'
  sourceNamespaces: []
  destinations:
  - server: "*"
    namespace: "*"
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'