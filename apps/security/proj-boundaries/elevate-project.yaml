apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: elevate-privileges
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  sourceRepos:
    - '*'
  sourceNamespaces: []
  destinations:
  - server: "*"
    namespace: "*"
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'