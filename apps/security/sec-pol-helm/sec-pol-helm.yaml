apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sec-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: sec-policies
    repoURL: oci://ghcr.io/betorvs/charts/sec-policies
    targetRevision: 0.1.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true