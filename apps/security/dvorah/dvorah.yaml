apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dvorah
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: security
  source:
    repoURL: 'https://github.com/betorvs/as-corp-ex-argocd-repo'
    targetRevision: HEAD
    path: manifests/security/dvorah
  destination:
    server: https://kubernetes.default.svc
    namespace: dvorah
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true