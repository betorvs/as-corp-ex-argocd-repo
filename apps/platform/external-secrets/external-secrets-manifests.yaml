apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: 'https://github.com/betorvs/as-corp-ex-argocd-repo'
    targetRevision: HEAD
    path: manifests/platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true