apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caddy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: 'https://github.com/betorvs/as-corp-ex-argocd-repo'
    targetRevision: HEAD
    path: manifests/platform/caddy
  destination:
    server: https://kubernetes.default.svc
    namespace: reverse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true