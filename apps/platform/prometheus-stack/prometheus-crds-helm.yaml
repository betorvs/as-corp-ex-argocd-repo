apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: 'https://github.com/betorvs/as-corp-ex-argocd-repo'
      targetRevision: HEAD
      ref: git-values
    - chart: loki
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 86.2.3
      helm:
        releaseName: prometheus-crds
        includeCRDs: true
        valueFiles:
          - $git-values/values/platform/prometheus-stack-crds/values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true