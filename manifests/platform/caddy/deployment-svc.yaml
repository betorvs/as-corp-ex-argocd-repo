# caddy-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: reverse
  labels:
    app: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: caddy
        image: "caddy:2.11.4-alpine"
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: certs
          mountPath: /etc/caddy/certs
          readOnly: true
        resources:
          limits:
            memory: "128Mi"
          requests:
            cpu: "50m"
      volumes:
      - name: config
        configMap:
          name: caddy-config
      - name: certs
        secret:
          secretName: caddy-tls # Must match the secretName in step 2
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: reverse
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    name: http
  - port: 443
    targetPort: https
    name: https
  selector:
    app: caddy
