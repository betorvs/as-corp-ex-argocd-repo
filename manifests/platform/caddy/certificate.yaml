apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: caddy
  namespace: reverse
spec:
  secretName: caddy-tls
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - caddy.reverse.svc.cluster.local
  - caddy.reverse
  - caddy.reverse.svc
  - vault.vault.svc.cluster.local
  - vault.vault.svc
  - vault.vault
  - prometheus-grafana.monitoring.svc.cluster.local
  - prometheus-grafana.monitoring.svc
  - prometheus-grafana.monitoring
  - alertmanager-operated.monitoring.svc.cluster.local
  - alertmanager-operated.monitoring.svc
  - alertmanager-operated.monitoring
  - prometheus.monitoring.svc.cluster.local 
  - prometheus.monitoring.svc
  - prometheus.monitoring