apiVersion: v1
kind: ServiceAccount
metadata:
  name: dvorah
  labels:
    helm.sh/chart: dvorah-0.3.0
    app.kubernetes.io/name: dvorah
    app.kubernetes.io/instance: dvorah
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: dvorah/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dvorah-config
data:
  docker-config.json: |
    "{\"credHelpers\": {\"123456789123.dkr.ecr.us-east-1.amazonaws.com\": \"ecr-login\"}}\n"
  config.yaml: |
    globalMode: "audit"
    globalProvider: "open-registry"
    globalRegistries: 
      - "index.docker.io/betorvs"
    globalPublicKey: |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEXBC/tG86ZkNXCMSODNnqWSv94czb
      QwYxG2qpcX90HRs3amRFfKMFcKWDNf3AmFmGRVySxvZYZ6ZR7WqYRTMm5Q==
      -----END PUBLIC KEY-----
    policies: 
      - name: "keyless dvorah"
        pattern: "ghcr.io/betorvs/dvorah:*"
        provider: "open-registry"
        registries:
          - "ghcr.io/betorvs/dvorah"
        mode: "deny"
        identity_regex: "^https://github.com/betorvs/dvorah/.github/workflows/release.yaml@refs/(heads/main|tags/v.*)$"
        issuer: "https://token.actions.githubusercontent.com"
      - name: "keyless argocd"
        pattern: "quay.io/argoproj/argocd:*"
        provider: "open-registry"
        registries:
          - "quay.io/argoproj/argocd"
        mode: "deny"
        identity_regex: "https://github.com/argoproj/argo-cd/.github/workflows/image-reuse.yaml@refs/tags/v"
        issuer: "https://token.actions.githubusercontent.com"
      - name: "keyless dexidp"
        pattern: "ghcr.io/dexidp/dex:*"
        provider: "open-registry"
        registries:
          - "ghcr.io/dexidp/dex"
        mode: "deny"
        identity_regex: "https://github.com/dexidp/dex/.github/workflows/artifacts.yaml@refs/tags/v"
        issuer: "https://token.actions.githubusercontent.com"
